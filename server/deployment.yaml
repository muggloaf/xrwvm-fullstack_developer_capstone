apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: dealership
  name: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dealership
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: dealership
    spec:
      containers:
      - image: us.icr.io/YOUR_SN_LABS_NAMESPACE/dealership:latest
        imagePullPolicy: Always
        name: dealership
        env:
        - name: backend_url
          value: "http://dealership-api:3030"
        - name: sentiment_analyzer_url
          value: "https://YOUR_CODE_ENGINE_HOST/"
        ports:
        - containerPort: 8000
          protocol: TCP
      restartPolicy: Always
