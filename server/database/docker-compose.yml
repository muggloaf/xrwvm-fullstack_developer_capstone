services:
  # Mongodb service
  mongo_db:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    volumes:
      - mongo_data:/data/db

  # Node api service
  api:
    build: .
    image: nodeapp
    ports:
      - 3030:3030
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  mongo_data: {}
